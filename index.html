<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>IRGO | Virtualna Asistentka 2026</title>
    
    <!-- SheetJS za Excel file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/loaders/GLTFLoader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/controls/OrbitControls.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            cursor: none;
        }

        .futuristic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 86, 166, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 107, 0, 0.15) 0%, transparent 50%);
            z-index: -2;
        }

        .quantum-field {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
        }

        .quantum-particle {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(0, 174, 239, 0.8);
            border-radius: 50%;
            animation: quantum-float 15s infinite linear;
        }

        @keyframes quantum-float {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(calc(100vw * var(--tx)), calc(-100vh * var(--ty))); opacity: 0; }
        }

        /* MAIN INTERFACE */
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            transition: opacity 0.8s ease;
        }

        .container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .hologram-container {
            position: relative;
            width: 400px; height: 400px;
            margin-bottom: 3rem;
        }

        .irgo-hologram {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 200px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, 
                    rgba(0, 174, 239, 0.9) 0%, 
                    rgba(0, 86, 166, 0.6) 40%, 
                    transparent 70%),
                radial-gradient(circle at 70% 70%, 
                    rgba(255, 107, 0, 0.7) 0%, 
                    rgba(255, 140, 0, 0.3) 30%, 
                    transparent 60%);
            box-shadow: 
                0 0 100px rgba(0, 174, 239, 0.6),
                0 0 200px rgba(255, 107, 0, 0.3) inset;
            z-index: 10;
            animation: hologram-rotate 20s infinite linear;
        }

        .irgo-hologram.speaking {
            animation: 
                hologram-rotate 20s infinite linear,
                hologram-pulse 0.8s infinite alternate,
                hologram-color-shift 2s infinite alternate;
            box-shadow: 
                0 0 150px rgba(0, 174, 239, 0.8),
                0 0 300px rgba(255, 107, 0, 0.4) inset,
                0 0 50px rgba(255, 255, 255, 0.3);
        }

        @keyframes hologram-rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes hologram-pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.15); }
        }

        @keyframes hologram-color-shift {
            0% { 
                filter: hue-rotate(0deg) brightness(1);
            }
            100% { 
                filter: hue-rotate(10deg) brightness(1.2);
            }
        }

        .irgo-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid;
            border-radius: 50%;
            animation: ring-rotate 25s infinite linear reverse;
        }

        .ring-1 { 
            width: 250px; height: 250px;
            border-color: rgba(0, 174, 239, 0.4);
            box-shadow: 0 0 30px rgba(0, 174, 239, 0.2);
        }
        
        .ring-2 { 
            width: 300px; height: 300px;
            border-color: rgba(255, 107, 0, 0.3);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.2);
            animation-delay: 0.5s;
            animation-duration: 30s;
        }

        .ring-3 { 
            width: 350px; height: 350px;
            border-color: rgba(255, 140, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.1);
            animation-delay: 1s;
            animation-duration: 35s;
        }

        @keyframes ring-rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.05); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        .irgo-button {
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, rgba(0, 86, 166, 0.2), rgba(0, 174, 239, 0.1));
            border: 2px solid rgba(0, 174, 239, 0.4);
            border-radius: 50px;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 10;
            margin-bottom: 3rem;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 
                0 5px 15px rgba(0, 86, 166, 0.2),
                0 0 30px rgba(0, 174, 239, 0.1) inset;
        }

        .irgo-button:hover {
            background: linear-gradient(135deg, rgba(0, 86, 166, 0.3), rgba(0, 174, 239, 0.2));
            border-color: rgba(255, 107, 0, 0.6);
            transform: translateY(-2px);
            box-shadow: 
                0 8px 25px rgba(0, 86, 166, 0.3),
                0 0 40px rgba(255, 107, 0, 0.2) inset;
        }

        .voice-visualizer {
            position: absolute;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 4px; opacity: 0;
        }

        .voice-bar {
            width: 4px; height: 20px;
            background: linear-gradient(to top, rgba(0, 174, 239, 0.9), rgba(255, 107, 0, 0.7));
            border-radius: 2px;
            animation: voice-bar-pulse 0.5s infinite alternate;
        }

        @keyframes voice-bar-pulse { 
            0% { transform: scaleY(0.3); } 
            100% { transform: scaleY(1.2); } 
        }

        .response-display {
            position: fixed; bottom: 3rem; left: 50%;
            transform: translateX(-50%);
            width: 80%; text-align: center; opacity: 0;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .response-bubble {
            background: linear-gradient(135deg, rgba(0, 86, 166, 0.2), rgba(0, 0, 0, 0.7));
            border: 1px solid rgba(0, 174, 239, 0.3);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .status-indicator {
            position: fixed; top: 2rem; left: 2rem;
            display: flex; align-items: center; gap: 0.75rem;
        }

        .status-dot { 
            width: 10px; height: 10px; 
            background: linear-gradient(135deg, #00ffaa, #00AEEF);
            border-radius: 50%; 
            box-shadow: 0 0 15px #00ffaa;
            animation: status-pulse 2s infinite;
        }

        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* 3D NAVIGATION SCREEN */
        #nav-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }

        #nav-container.active {
            opacity: 1;
            pointer-events: all;
        }

        #nav-overlay {
            position: absolute; 
            top: 20px; 
            width: 100%;
            text-align: center; 
            color: #00d2ff;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00d2ff;
            pointer-events: none; 
            z-index: 10;
        }

        .room-label {
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            padding: 4px 10px;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.5);
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
            backdrop-filter: blur(2px);
        }

        .navigation-info {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 86, 166, 0.9), rgba(0, 0, 0, 0.9));
            padding: 1.5rem 2.5rem;
            border-radius: 15px;
            border: 1px solid rgba(0, 174, 239, 0.4);
            text-align: center;
            min-width: 350px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .navigation-info h3 {
            color: #00AEEF;
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        .back-button {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, rgba(0, 86, 166, 0.3), rgba(0, 174, 239, 0.2));
            border: 1px solid rgba(0, 174, 239, 0.4);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(10px);
            display: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: linear-gradient(135deg, rgba(0, 86, 166, 0.4), rgba(255, 107, 0, 0.3));
            border-color: rgba(255, 107, 0, 0.6);
            transform: translateY(-2px);
        }

        .back-button.visible {
            display: block;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .loading-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(0, 174, 239, 0.2);
            border-top: 4px solid #00AEEF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .irgo-logo {
            position: fixed;
            top: 2rem;
            right: 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00AEEF, #FF6B00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            z-index: 100;
        }

        .loading-status {
            position: fixed;
            bottom: 4rem;
            left: 0;
            width: 100%;
            text-align: center;
            color: #00AEEF;
            font-size: 1rem;
            z-index: 100;
        }

        /* Tablet optimizacije */
        @media (max-width: 768px) {
            .hologram-container {
                width: 300px;
                height: 300px;
            }
            
            .irgo-hologram {
                width: 150px;
                height: 150px;
            }
            
            .ring-1 { width: 200px; height: 200px; }
            .ring-2 { width: 250px; height: 250px; }
            .ring-3 { width: 300px; height: 300px; }
            
            .irgo-button {
                padding: 1.5rem 3rem;
                font-size: 1.2rem;
                margin-bottom: 2rem;
            }
            
            .navigation-info {
                min-width: 300px;
                padding: 1.2rem 2rem;
                bottom: 100px;
            }
            
            .voice-visualizer {
                bottom: 150px;
            }
            
            .response-display {
                width: 90%;
                bottom: 2rem;
            }
        }

        @media (max-width: 480px) {
            .hologram-container {
                width: 250px;
                height: 250px;
                margin-bottom: 2rem;
            }
            
            .irgo-hologram {
                width: 120px;
                height: 120px;
            }
            
            .ring-1 { width: 160px; height: 160px; }
            .ring-2 { width: 200px; height: 200px; }
            .ring-3 { width: 240px; height: 240px; }
            
            .irgo-button {
                padding: 1.2rem 2rem;
                font-size: 1rem;
                margin-bottom: 1.5rem;
            }
            
            .navigation-info {
                min-width: 280px;
                padding: 1rem 1.5rem;
                bottom: 90px;
            }
            
            .navigation-info h3 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="futuristic-bg"></div>
    <div class="quantum-field" id="quantum-field"></div>
    <div class="irgo-logo">IRGO</div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
        <div style="color: #00AEEF; font-size: 1.2rem; margin-top: 1rem;">Nalagam IRGO sistem...</div>
        <div class="loading-status" id="loading-status"></div>
    </div>

    <!-- Main Interface -->
    <div class="container" id="main-container">
        <div class="status-indicator">
            <div class="status-dot"></div>
            <div class="status-text" id="status-text">SISTEM ONLINE</div>
        </div>

        <div class="hologram-container">
            <div class="irgo-ring ring-1"></div>
            <div class="irgo-ring ring-2"></div>
            <div class="irgo-ring ring-3"></div>
            
            <div class="irgo-hologram" id="irgo-hologram"></div>
        </div>

        <div class="voice-visualizer" id="voice-visualizer">
            <div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div>
            <div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div>
            <div class="voice-bar"></div><div class="voice-bar"></div>
        </div>

        <button class="irgo-button" id="assist-button">
            <span style="color: #00AEEF;">PRIŠEL/LA</span> 
            <span style="color: #FF6B00; margin: 0 10px;">|</span>
            <span style="color: #FFFFFF;">SEM NA SASTANEK</span>
        </button>

        <div class="response-display" id="response-display">
            <div class="response-bubble">
                <div id="response-text">IRGO sistem se pripravlja. Nalagam podatke...</div>
                <div id="response-time" style="font-size: 0.9rem; color: rgba(0, 174, 239, 0.7); margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- Navigation Screen -->
    <div id="nav-container">
        <div id="nav-overlay">IRGO- Navigator</div>
        <div id="navigation-info" class="navigation-info">
            <h3>IRGO NAVIGACIJA</h3>
            <p style="color: #00AEEF; margin: 10px 0;" id="nav-guest-name"><strong>Nalagam podatke...</strong></p>
            <p style="margin: 5px 0;">Soba: <strong id="nav-room">102</strong> <span id="nav-room-name">(Sejna soba)</span></p>
            <p style="margin: 5px 0;">Čas: <strong id="nav-time">09:00</strong></p>
            <p style="margin: 10px 0; font-size: 0.9rem;" id="nav-description">Navigacija v pripravi</p>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0, 174, 239, 0.3);">
                <p id="nav-instruction">Sledite rdečim puščicam na 3D modelu</p>
            </div>
        </div>
    </div>

    <button class="back-button" id="back-button">← Nazaj na začetek</button>

    <script>
        // CSS2D klase (jer nisu u CDN)
        class CSS2DObject {
            constructor(element = document.createElement('div')) {
                this.element = element;
                this.element.style.position = 'absolute';
                this.element.style.pointerEvents = 'auto';
                this.element.style.userSelect = 'none';
                this.element.setAttribute('data-3d-object', 'true');
                
                // THREE.Object3D svojstva
                this.position = new THREE.Vector3();
                this.matrixWorld = new THREE.Matrix4();
                this.visible = true;
                this.parent = null;
                this.children = [];
            }
            
            add(object) {
                this.children.push(object);
                object.parent = this;
            }
            
            traverse(callback) {
                callback(this);
                for (const child of this.children) {
                    child.traverse(callback);
                }
            }
        }

        class CSS2DRenderer {
            constructor() {
                this.domElement = document.createElement('div');
                this.domElement.style.overflow = 'hidden';
                this.domElement.style.position = 'absolute';
                this.domElement.style.top = '0';
                this.domElement.style.left = '0';
                this.domElement.style.pointerEvents = 'none';
                
                this.camera = null;
                this.width = 0;
                this.height = 0;
                this.widthHalf = 0;
                this.heightHalf = 0;
                
                this.vector = new THREE.Vector3();
                this.viewMatrix = new THREE.Matrix4();
                this.viewProjectionMatrix = new THREE.Matrix4();
            }
            
            setSize(width, height) {
                this.width = width;
                this.height = height;
                this.widthHalf = width / 2;
                this.heightHalf = height / 2;
                
                this.domElement.style.width = width + 'px';
                this.domElement.style.height = height + 'px';
            }
            
            render(scene, camera) {
                this.camera = camera;
                this.viewMatrix.copy(camera.matrixWorldInverse);
                this.viewProjectionMatrix.multiplyMatrices(camera.projectionMatrix, this.viewMatrix);
                
                // Očisti prethodne elemente
                while (this.domElement.firstChild) {
                    this.domElement.removeChild(this.domElement.firstChild);
                }
                
                scene.traverse(obj => {
                    if (obj instanceof CSS2DObject && obj.visible) {
                        this.vector.setFromMatrixPosition(obj.matrixWorld || new THREE.Matrix4());
                        this.vector.applyMatrix4(this.viewProjectionMatrix);
                        
                        const x = (this.vector.x * this.widthHalf) + this.widthHalf;
                        const y = -(this.vector.y * this.heightHalf) + this.heightHalf;
                        
                        if (this.vector.z > -1 && this.vector.z < 1) {
                            obj.element.style.transform = `translate(-50%, -50%) translate(${x}px,${y}px)`;
                            obj.element.style.zIndex = Math.floor((1 - this.vector.z) * 100000);
                            obj.element.style.display = 'block';
                            
                            if (!obj.element.parentNode || obj.element.parentNode !== this.domElement) {
                                this.domElement.appendChild(obj.element);
                            }
                        } else {
                            obj.element.style.display = 'none';
                        }
                    }
                });
            }
        }

        // Globalne varijable
        let scene, camera, renderer, controls, labelRenderer;
        let isNavigationActive = false;
        let animationSpeed = 0.0006;
        let currentGuest = null;
        let excelData = null;
        let femaleVoice = null;

        // Barve IRGO sheme
        const IRGO_COLORS = {
            blue: 0x00AEEF,
            darkBlue: 0x0056A6,
            orange: 0xFF6B00,
            lightOrange: 0xFF8C00
        };

        // Slovenian numbers pronunciation - POBOLJŠANA VERZIJA
        const slovenianNumbers = {
            ones: ['', 'ena', 'dve', 'tri', 'štiri', 'pet', 'šest', 'sedem', 'osem', 'devet'],
            teens: ['deset', 'enajst', 'dvanajst', 'trinajst', 'štirinajst', 'petnajst', 'šestnajst', 'sedemnajst', 'osemnajst', 'devetnajst'],
            tens: ['', '', 'dvajset', 'trideset', 'štirideset', 'petdeset', 'šestdeset', 'sedemdeset', 'osemdeset', 'devetdeset'],
            hundreds: ['', 'sto', 'dvesto', 'tristo', 'štiristo', 'petsto', 'šeststo', 'sedemsto', 'osemsto', 'devetsto'],
            
            pronounceRoomNumber: function(roomNumber) {
                const num = parseInt(roomNumber);
                
                if (isNaN(num)) return roomNumber;
                
                // Posebni primeri
                if (num === 0) return 'nič';
                if (num < 10) return this.ones[num];
                if (num < 20) return this.teens[num - 10];
                
                // Dvomestne številke
                if (num < 100) {
                    const tens = Math.floor(num / 10);
                    const ones = num % 10;
                    if (ones === 0) return this.tens[tens];
                    // Posebna pravila za sestavljanje: 21 = "enaindvajset", ne "ena in dvajset"
                    return this.ones[ones] + 'in' + this.tens[tens];
                }
                
                // Trimestne številke
                if (num < 1000) {
                    const hundreds = Math.floor(num / 100);
                    const remainder = num % 100;
                    
                    // Posebni primeri za okrogle številke
                    if (remainder === 0) {
                        return this.hundreds[hundreds];
                    }
                    
                    let result = this.hundreds[hundreds];
                    
                    if (remainder > 0) {
                        if (remainder < 10) {
                            // 101, 102, ...
                            result += ' ' + this.ones[remainder];
                        } else if (remainder < 20) {
                            // 110, 111, ...
                            result += ' ' + this.teens[remainder - 10];
                        } else {
                            const tens = Math.floor(remainder / 10);
                            const ones = remainder % 10;
                            if (ones === 0) {
                                result += ' ' + this.tens[tens];
                            } else {
                                result += ' ' + this.ones[ones] + 'in' + this.tens[tens];
                            }
                        }
                    }
                    
                    return result;
                }
                
                return num.toString();
            }
        };

        // Inicijalizacija
        async function init() {
            console.log("IRGO sistem se zaganja...");
            initParticles();
            
            // Event listeners
            document.getElementById('assist-button').addEventListener('click', handleArrival);
            document.getElementById('back-button').addEventListener('click', backToMain);
            
            // Začni z nalaganjem sistema
            showLoading(true);
            
            try {
                // 1. Naloži Excel podatke iz Google Sheets
                await loadExcelFromGoogleSheets();
                
                // 2. Inicializiraj 3D navigacijsko sceno
                await initNavigationScene();
                
                // 3. Setup za govor - posebna pažnja za tablet
                await setupSpeechSynthesisForTablet();
                
                // 4. Sistem pripravljen

                speak("IRGO sistem pripravljen. Dobrodošli v IRGO navigacijskem sistemu.", "IRGO", 0.95);

        // Inicializiraj 3D navigacijsko sceno
        async function initNavigationScene() {
            updateLoadingStatus("Pripravljam 3D navigacijo...");
            
            try {
                // Ustvari sceno
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x00050a);
                
                // Kamera
                camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 1000);
                camera.position.set(15, 12, 12);
                
                // WebGL Renderer
                renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true,
                    powerPreference: "high-performance"
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.getElementById('nav-container').appendChild(renderer.domElement);
                
                // CSS2D Renderer za oznake
                labelRenderer = new CSS2DRenderer();
                labelRenderer.setSize(window.innerWidth, window.innerHeight);
                labelRenderer.domElement.style.position = 'absolute';
                labelRenderer.domElement.style.top = '0px';
                labelRenderer.domElement.style.pointerEvents = 'none';
                document.getElementById('nav-container').appendChild(labelRenderer.domElement);
                
                // Orbit kontrole
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.minDistance = 5;
                controls.maxDistance = 50;
                
                // Svetloba
                scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                const dirLight = new THREE.DirectionalLight(0x00aaff, 1.2);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);
                
                // Naloži model
                updateLoadingStatus("Nalagam 3D model...");
                await loadHouseModel('https://raw.githubusercontent.com/Stroteh/Navigator/main/hisa.glb');
                
                // Dodaj navigacijsko pot
                createNavigationPath();
                
                // Animacijska zanka
                function animate() {
                    requestAnimationFrame(animate);
                    if (controls) controls.update();
                    if (renderer && scene && camera) {
                        renderer.render(scene, camera);
                    }
                    if (labelRenderer && scene && camera) {
                        labelRenderer.render(scene, camera);
                    }
                    
                    if (window.arrowTexture) {
                        window.arrowTexture.offset.x -= animationSpeed;
                    }
                    
                    if (window.ball && window.curve) {
                        window.t = (window.t || 0) + animationSpeed;
                        if (window.t > 1) window.t = 0;
                        window.ball.position.copy(window.curve.getPointAt(window.t));
                    }
                }
                animate();
                
                // Resize handler
                window.addEventListener('resize', () => {
                    if (camera) {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                    }
                    if (renderer) {
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    }
                    if (labelRenderer) {
                        labelRenderer.setSize(window.innerWidth, window.innerHeight);
                    }
                });
                
                console.log("3D navigacija pripravljena.");
                
            } catch (error) {
                console.error("Napaka pri inicializaciji navigacijske scene:", error);
                throw error;
            }
        }

        // Naloži hišni model
        async function loadHouseModel(url) {
            return new Promise((resolve, reject) => {
                const loader = new THREE.GLTFLoader();
                
                loader.load(url, (gltf) => {
                    gltf.scene.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshPhongMaterial({
                                color: 0x00ffff, 
                                transparent: true, 
                                opacity: 0.15, 
                                side: THREE.DoubleSide, 
                                depthWrite: false
                            });
                            
                            const edges = new THREE.EdgesGeometry(child.geometry);
                            const line = new THREE.LineSegments(
                                edges, 
                                new THREE.LineBasicMaterial({ 
                                    color: 0x00ffff, 
                                    transparent: true, 
                                    opacity: 0.6 
                                })
                            );
                            child.add(line);
                            
                            if (child.name === '3D_Solid011' || child.name.toLowerCase().includes('sejna')) {
                                child.material.color.set(0xff5500);
                                child.material.opacity = 0.5;
                                child.material.emissive = new THREE.Color(0xff5500);
                                child.material.emissiveIntensity = 0.4;
                            }
                        }
                    });
                    
                    scene.add(gltf.scene);
                    
                    // Dodaj oznake za sobe
                    addRoomLabels();
                    
                    resolve();
                }, undefined, (error) => {
                    console.error("Napaka pri nalaganju modela:", error);
                    // Dodaj fallback geometriju ako model ne uspije učitati
                    addFallbackGeometry();
                    resolve();
                });
            });
        }

                new THREE.Vector3(-3.95, 0.15, -5.00),

        // Ustvari teksturo puščic
        function createArrowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; 
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, 256, 128);
            ctx.fillStyle = '#ff0055';

            ctx.fillRect(20, 54, 140, 20);
            ctx.beginPath();
            ctx.moveTo(160, 24);
            ctx.lineTo(230, 64);
            ctx.lineTo(160, 104);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.repeat.set(3, 2);
            return texture;
        }

        async function setupSpeechSynthesisForTablet() {
            updateLoadingStatus("Pripravljam glasovni sistem...");
            
            return new Promise((resolve) => {
                // Čekaj malo da se stranica potpuno učita
                setTimeout(() => {

                    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    console.log("Je li tablet/mobitel?", isMobile);
                    
                    // Pripremi za Petra glas
                    findAndSetPetraVoice(voices);
                    
                    // Ako nismo našli Petra glas, pokušaj ponovno nakon 1 sekunde
                    if (!femaleVoice && isMobile) {
                        setTimeout(() => {
                            const voicesAgain = speechSynthesis.getVoices();
                            console.log("Ponovno učitani glasovi:", voicesAgain);
                            findAndSetPetraVoice(voicesAgain);
                            
                            // Ako i dalje nema Petra, koristi default
                            if (!femaleVoice && voicesAgain.length > 0) {
                                femaleVoice = voicesAgain[0];
                                console.log("Koristim default glas:", femaleVoice.name);

                            resolve();

        // Funkcija za pronalaženje Petra glasa
        function findAndSetPetraVoice(voices) {
            // Prioriteti za Petra glas:
            // 1. Petra (slovenski)
            // 2. Bilo koji slovenski ženski glas
            // 3. Bilo koji ženski glas
            // 4. Prvi dostupan glas
            
            let foundVoice = null;
            
            // Prvo traži Petra
            foundVoice = voices.find(voice => 
                voice.name.includes('Petra') && 
                voice.lang.startsWith('sl')
            );
            
            // Ako nema Petra, traži bilo koji slovenski ženski
            if (!foundVoice) {
                foundVoice = voices.find(voice => 
                    voice.lang.startsWith('sl') && 
                    (voice.name.toLowerCase().includes('female') ||
                     voice.name.includes('žensk') ||
                     voice.name.includes('Žensk') ||
                     voice.name.includes('Vesna') ||
                     voice.name.includes('Alenka'))
                );
            }
            
            // Ako nema slovenskog ženskog, traži bilo koji ženski
            if (!foundVoice) {
                foundVoice = voices.find(voice => 
                    voice.name.toLowerCase().includes('female') ||
                    voice.name.includes('Microsoft Zira') ||
                    voice.name.includes('Google UK Female') ||
                    voice.name.includes('Google US Female')
                );
            }
            
            // Ako nema ni toga, uzmi prvi dostupan
            if (!foundVoice && voices.length > 0) {
                foundVoice = voices[0];
            }
            
            femaleVoice = foundVoice;
            
            if (femaleVoice) {
                console.log("Odabran glas za tablet:", femaleVoice.name, "Jezik:", femaleVoice.lang);
                updateLoadingStatus("Glasovni sistem pripravljen: " + femaleVoice.name);
            } else {
                console.warn("Nijedan glas nije dostupan");
                updateLoadingStatus("Glasovni sistem nije dostupan");
            }
        }

        // Glavna logika za prihod
        async function handleArrival() {
            if (!excelData || excelData.length === 0) {
                speak("Napaka: Podatki o sestankih nisu dostupni. Molimo osvježite stranicu.", "IRGO");
                return;
            }
            
            try {
                showResponse("IRGO traži vaš termin...", "Traženje");
                
                const now = new Date();
                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                
                let bestGuest = null;
                let minDifference = Infinity;
                
                excelData.forEach(guest => {
                    if (!guest.vrijeme) return;
                    
                    const timeStr = guest.vrijeme.toString();
                    const timeParts = timeStr.split(':');
                    if (timeParts.length < 2) return;
                    
                    const h = parseInt(timeParts[0], 10);
                    const m = parseInt(timeParts[1], 10);
                    
                    if (isNaN(h) || isNaN(m)) return;
                    
                    const plannedMinutes = h * 60 + m;
                    const difference = Math.abs(currentMinutes - plannedMinutes);
                    
                    if (difference < 120 && difference < minDifference) {
                        minDifference = difference;
                        bestGuest = guest;
                    }
                });

                if (bestGuest) {
                    currentGuest = bestGuest;
                    showNavigation(bestGuest);
                } else {
                    currentGuest = excelData[0];
                    showNavigation(excelData[0]);
                }
            } catch (e) {
                console.error("Greška:", e);
                speak("Greška u obradi podataka. Koristim zadani termin.", "IRGO");
                if (excelData && excelData.length > 0) {
                    currentGuest = excelData[0];
                    showNavigation(excelData[0]);
                }
            }
        }

        // Začni s govorom navigacije - OPTIMIZIRANO ZA TABLET
        function startNavigationSpeech(guest) {
            const roomDescription = getRoomDescription(guest.soba);
            const now = new Date();
            const currentTime = now.getHours() * 60 + now.getMinutes();
            const [h, m] = guest.vrijeme.split(':').map(Number);
            const meetingTime = h * 60 + m;
            const timeDifference = currentTime - meetingTime;
            
            let greeting = `Pozdravljeni, ${guest.ime}. `;
            
            // Tablet optimizacija: kraći govor za bolje iskustvo
            if (timeDifference < -15) {
                greeting += `Prišli ste ranije. Imate vremena za kavu! `;
                animationSpeed = 0.0003;
                document.getElementById('nav-instruction').textContent = "Sledite puščicama do sobe";
            } else if (timeDifference < -5) {
                greeting += `Odlično, točno na vrijeme! `;
                animationSpeed = 0.0004;
                document.getElementById('nav-instruction').textContent = "Sledite puščicama";
            } else if (timeDifference > 15) {
                greeting += `Počutite se opušteno. Brzo vas vodim do sobe. `;
                animationSpeed = 0.0008;
                document.getElementById('nav-instruction').textContent = "Brzo sledite puščicama";
            } else if (timeDifference > 5) {
                greeting += `Idemo brzo do sobe. `;
                animationSpeed = 0.0007;
                document.getElementById('nav-instruction').textContent = "Sledite puščicama";
            } else {
                greeting += `Savršeno vrijeme! `;
                animationSpeed = 0.0006;
                document.getElementById('nav-instruction').textContent = "Sledite puščicama";
            }
            
            const roomNumberSpoken = slovenianNumbers.pronounceRoomNumber(guest.soba);
            const navigation = `Sastanak je u sobi ${roomNumberSpoken}. ${roomDescription}. `;
            const instructions = `Sledite crvenim strelicama na ekranu. `;
            const closing = `Ugodan sastanak!`;
            
            // Kraća verzija za tablet
            const fullSpeech = greeting + navigation + instructions + closing;
            
            // Govori sporije i jasnije za tablet
            speak(fullSpeech, "IRGO Navigacija", 0.85);
        }

        // Govor s IRGO glasom - OPTIMIZIRANO ZA TABLET
        function speak(text, name = "", rate = 0.85) {
            // Zaustavi sve govore prije nego počnemo novi
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            
            // Mali delay za stabilnost
            setTimeout(() => {
                if (!window.speechSynthesis) {
                    console.error("Speech synthesis not available");
                    showResponse(text, name || "IRGO Asistent");
                    return;
                }
                
                const msg = new SpeechSynthesisUtterance(text);
                
                // Postavi Petra glas ili alternativu
                if (femaleVoice) {
                    msg.voice = femaleVoice;
                    msg.lang = femaleVoice.lang;
                    console.log("Koristim glas:", femaleVoice.name);
                } else {
                    // Ako nema glasa, pokušaj ponovno naći
                    const voices = speechSynthesis.getVoices();
                    findAndSetPetraVoice(voices);
                    if (femaleVoice) {
                        msg.voice = femaleVoice;
                        msg.lang = femaleVoice.lang;
                    } else {
                        msg.lang = 'sl-SI';
                    }
                }
                
                // Tablet optimizacija: sporije i jasnije
                msg.rate = rate;
                msg.pitch = 1.0; // Normalna visina za bolju razumljivost
                msg.volume = 1.0;
                
                // Vizualni efekti
                const hologram = document.getElementById('irgo-hologram');
                if (hologram) hologram.classList.add('speaking');
                
                const voiceVis = document.getElementById('voice-visualizer');
                if (voiceVis) voiceVis.style.opacity = '1';
                
                const statusText = document.getElementById('status-text');
                if (statusText) statusText.textContent = "IRGO GOVORI";
                
                showResponse(text, name || "IRGO Asistent");
                
                // Animacija glasovnih traka
                const voiceBars = document.querySelectorAll('.voice-bar');
                voiceBars.forEach(bar => {
                    bar.style.animation = 'voice-bar-pulse 0.5s infinite alternate';
                });
                
                // Kada govor završi
                msg.onend = () => {
                    if (hologram) hologram.classList.remove('speaking');
                    if (voiceVis) voiceVis.style.opacity = '0';
                    if (statusText) statusText.textContent = "IRGO ONLINE";
                    
                    voiceBars.forEach(bar => {
                        bar.style.animation = 'none';
                    });
                };
                
                // Na grešku
                msg.onerror = (event) => {
                    console.error("Greška u govoru:", event);
                    if (hologram) hologram.classList.remove('speaking');
                    if (voiceVis) voiceVis.style.opacity = '0';
                    if (statusText) statusText.textContent = "IRGO ONLINE";
                    
                    // Fallback: prikaži tekst ako govor ne radi
                    showResponse(text + " (glas nije dostupan)", name || "IRGO");
                };
                
                // Zapocni govor
                window.speechSynthesis.speak(msg);
            }, 200);
        }

        // Prikaži odgovor
        function showResponse(text, sub) {
            const display = document.getElementById('response-display');
            const textElement = document.getElementById('response-text');
            const timeElement = document.getElementById('response-time');
            
            if (!display || !textElement || !timeElement) return;
            
            const displayText = text.length > 150 ? text.substring(0, 150) + "..." : text;
            textElement.textContent = displayText;
            timeElement.textContent = sub;
            
            display.style.opacity = '1';
            
            const displayTime = text.length > 100 ? 8000 : 10000;
            
            setTimeout(() => {
                display.style.opacity = '0';
            }, displayTime);
        }

        // Pokreni aplikaciju
        window.addEventListener('DOMContentLoaded', init);

        // Tablet optimizacija: spriječi zoom s dva prsta
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // Detekcija tableta i prilagodba
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            console.log("Tablet/mobitel detektiran, primjenjujem optimizacije");
            
            // Povećaj tap targets za bolje dodirivanje
            document.querySelectorAll('.irgo-button, .back-button').forEach(button => {
                button.style.padding = '1.5rem 3rem';
                button.style.fontSize = '1.2rem';
            });
            
            // Optimiziraj vizualizator glasa za manji ekran
            const voiceVis = document.getElementById('voice-visualizer');
            if (voiceVis) {
                voiceVis.style.bottom = '150px';
            }
        }
    </script>
</body>
</html>
